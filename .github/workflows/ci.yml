name: CI

# Validation only. This workflow never deploys.
# - Runs on pull requests.
# - Is also called by deploy.yml so the same checks gate every deployment.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_BASE_PATH: /morts-portfolio/
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (lockfile required)
        run: npm ci

      - name: Check configuration
        run: npm run check:config

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - name: Script tests
        run: npm run test:scripts

      - name: Build
        run: npm run build

      - name: Scan build output for secrets
        run: npm run scan:dist

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Route matrix (local Pages simulator)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
